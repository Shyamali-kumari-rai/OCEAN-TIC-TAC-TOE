<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ocean Tic Tac Toe 🌊🐠</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🌊 Ocean Tic Tac Toe 🐠</h1>
  <div id="status">Player 🐠's Turn</div>

  <!-- 🐚 GAME BOARD -->
  <div class="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <!-- 🔁 RESTART BUTTON -->
  <button onclick="restartGame()">Restart Game</button>

  <!-- 🐟 SWIMMING FISH -->
  <div class="fish">🐟</div>
  <div class="fish">🐠</div>
  <div class="fish">🐡</div>
  <div class="scoreboard">
  <div class="score x-score">
    🐠 Player X: <span id="scoreX">0</span>
  </div>
  <div class="score o-score">
    🐡 Player O: <span id="scoreO">0</span>
  </div>
</div>

  <!-- 🔊 SOUND EFFECTS -->
  <!-- Create a folder named "sounds" and add these files -->
  <audio id="clickSound" src="waterdrop.mp3"></audio>
  <audio id="winSound" src="win.mp3"></audio>

  <!-- 🫧 BUBBLE SCRIPT -->
  <script>
    // create bubbles dynamically
    for (let i = 0; i < 25; i++) {
      const bubble = document.createElement("div");
      bubble.classList.add("bubble");

      bubble.style.left = Math.random() * 100 + "vw";
      bubble.style.animationDuration = (5 + Math.random() * 5) + "s";
      bubble.style.width = bubble.style.height = (10 + Math.random() * 20) + "px";

      document.body.appendChild(bubble);
    }
  </script>

  <!-- 🎮 GAME SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
